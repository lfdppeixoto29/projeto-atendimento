version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:v2.1.1
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - AUTH_GLOBAL_API_KEY=sua_global_api_key_aqui
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:senha@postgres:5432/evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_CHATS=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_MESSAGES=true
      - CLEAN_STORE=false
      - DEL_INSTANCE=false
      - CONFIG_SESSION_PHONE_CLIENT=WhatsApp
      - CONFIG_SESSION_PHONE_NAME=Chrome
    depends_on:
      - postgres

  postgres:
    image: postgres:15-alpine
    container_name: evolution-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=senha
      - POSTGRES_DB=evolution
    volumes:
      - pgdata:/var/lib/postgresql/data

  chatbot-webhook:
    build: .
    container_name: chatbot-webhook
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - EVOLUTION_API_URL=http://evolution-api:8080
      - EVOLUTION_API_KEY=sua_global_api_key_aqui
      - INSTANCE_NAME=atendimento_principal
    depends_on:
      - evolution-api

volumes:
  pgdata:
